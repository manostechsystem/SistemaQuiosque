name: Build Android APK (.apk)

on:
  push:
    branches: [ main ]
    paths:
      - 'src/**'
      - 'capacitor.config.json'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies & Capacitor
        run: |
          npm install
          npm install --save-dev @capacitor/cli @capacitor/core @capacitor/android

      - name: Initialize Android Project
        run: |
          npx cap add android
          npx cap sync android

      - name: Configure Android App Icons (ManosTech Robot Mascot)
        run: |
          # Copia o ícone do mascote para todas as densidades de tela do Android
          for dir in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            target="android/app/src/main/res/mipmap-$dir"
            if [ -d "$target" ]; then
              cp src/assets/manostech-icon.png "$target/ic_launcher.png"
              cp src/assets/manostech-icon.png "$target/ic_launcher_round.png"
            fi
          done

      - name: Build Android APK (Gradle)
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Prepare APK Output
        run: |
          mkdir -p output_apk
          cp android/app/build/outputs/apk/debug/app-debug.apk output_apk/ManosTech-PDV.apk

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ManosTech-PDV-Android-APK
          path: output_apk/ManosTech-PDV.apk
          retention-days: 30
