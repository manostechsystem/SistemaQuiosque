name: Build Android APK (.apk)

on:
  push:
    branches: [ main ]
    paths:
      - 'src/**'
      - 'mobile_app/**'
      - 'capacitor.config.json'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: |
          npm install
          npm install --save-dev @capacitor/core@^6.0.0 @capacitor/cli@^6.0.0 @capacitor/android@^6.0.0

      - name: Initialize Android Project
        run: |
          npx cap add android || true
          npx cap sync android

      - name: Configure Android App Icons (ManosTech Robot Mascot)
        run: |
          # 1. Remove XMLs de adaptive icon v26 para garantir que o icone PNG do robo seja exibido 100% fiel
          rm -rf android/app/src/main/res/mipmap-anydpi-v26

          # 2. Copia o icone do mascote para todas as densidades (ic_launcher, round e foreground)
          for dir in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            target="android/app/src/main/res/mipmap-$dir"
            if [ -d "$target" ]; then
              cp mobile_app/assets/manostech-icon.png "$target/ic_launcher.png"
              cp mobile_app/assets/manostech-icon.png "$target/ic_launcher_round.png"
              cp mobile_app/assets/manostech-icon.png "$target/ic_launcher_foreground.png"
            fi
          done

      - name: Configure Permissions and Cleartext Traffic
        run: |
          # Garante permissao de Camera para QR Code e navegacao em rede local (Cleartext HTTP)
          manifest="android/app/src/main/AndroidManifest.xml"
          if [ -f "$manifest" ]; then
            sed -i '/<application/i \    <uses-permission android:name="android.permission.CAMERA" />\n    <uses-permission android:name="android.permission.INTERNET" />\n    <uses-feature android:name="android.hardware.camera" android:required="false" />' "$manifest"
            sed -i 's/<application/<application android:usesCleartextTraffic="true"/g' "$manifest"
          fi

      - name: Build Android APK (Gradle)
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Prepare APK Output
        run: |
          mkdir -p output_apk
          cp android/app/build/outputs/apk/debug/app-debug.apk output_apk/ManosTech-PDV.apk

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ManosTech-PDV-Android-APK
          path: output_apk/ManosTech-PDV.apk
          retention-days: 30
