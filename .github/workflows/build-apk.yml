name: Build Android APKs (Gestor & Garçom)

on:
  push:
    branches: [ main ]
    paths:
      - 'src/**'
      - 'mobile_app/**'
      - 'garcom_app/**'
      - 'capacitor.config.json'
      - 'capacitor.garcom.json'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: |
          npm install
          npm install --save-dev @capacitor/core@^6.0.0 @capacitor/cli@^6.0.0 @capacitor/android@^6.0.0

      - name: Build Gestor APK (ManosTech-System.apk)
        run: |
          mkdir -p output_apk
          npx cap add android || true
          npx cap sync android
          rm -rf android/app/src/main/res/mipmap-anydpi-v26
          for dir in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            target="android/app/src/main/res/mipmap-$dir"
            if [ -d "$target" ]; then
              cp mobile_app/assets/manostech-icon.png "$target/ic_launcher.png"
              cp mobile_app/assets/manostech-icon.png "$target/ic_launcher_round.png"
              cp mobile_app/assets/manostech-icon.png "$target/ic_launcher_foreground.png"
            fi
          done
          manifest="android/app/src/main/AndroidManifest.xml"
          if [ -f "$manifest" ]; then
            sed -i '/<application/i \    <uses-permission android:name="android.permission.CAMERA" />\n    <uses-permission android:name="android.permission.INTERNET" />\n    <uses-feature android:name="android.hardware.camera" android:required="false" />' "$manifest"
            sed -i 's/<application/<application android:usesCleartextTraffic="true"/g' "$manifest"
          fi
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
          cd ..
          cp android/app/build/outputs/apk/debug/app-debug.apk output_apk/ManosTech-System.apk

      - name: Build Garçom APK (ManosTech-Garcom.apk)
        run: |
          rm -rf android
          npx cap add android --config capacitor.garcom.json || true
          npx cap sync android --config capacitor.garcom.json
          rm -rf android/app/src/main/res/mipmap-anydpi-v26
          for dir in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            target="android/app/src/main/res/mipmap-$dir"
            if [ -d "$target" ]; then
              cp garcom_app/assets/manostech-icon.png "$target/ic_launcher.png"
              cp garcom_app/assets/manostech-icon.png "$target/ic_launcher_round.png"
              cp garcom_app/assets/manostech-icon.png "$target/ic_launcher_foreground.png"
            fi
          done
          manifest="android/app/src/main/AndroidManifest.xml"
          if [ -f "$manifest" ]; then
            sed -i '/<application/i \    <uses-permission android:name="android.permission.INTERNET" />' "$manifest"
            sed -i 's/<application/<application android:usesCleartextTraffic="true"/g' "$manifest"
          fi
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
          cd ..
          cp android/app/build/outputs/apk/debug/app-debug.apk output_apk/ManosTech-Garcom.apk

      - name: Upload Android APKs Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ManosTech-Android-APKs
          path: output_apk/*.apk
          retention-days: 30
